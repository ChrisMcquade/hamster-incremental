<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <meta name="theme-color" content="#f59e0b">
        <link rel="manifest" href="manifest.json">
          <title>Hamster Haven</title>
            <script src="https://cdn.tailwindcss.com"></script>
              <style>
                  /* Prevent text selection and zoom latency on rapid taps */
                      body {
                            -webkit-touch-callout: none;
                                  -webkit-user-select: none;
                                        user-select: none;
                                              touch-action: manipulation;
                                                  }
                                                      @keyframes floatUp {
                                                            0% { opacity: 1; transform: translateY(0px) scale(1); }
                                                                  100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
                                                                      }
                                                                          .tap-pop {
                                                                                animation: floatUp 0.6s ease-out forwards;
                                                                                      pointer-events: none;
                                                                                          }
                                                                                            </style>
                                                                                            </head>
                                                                                            <body class="bg-amber-50 text-slate-800 flex flex-col h-screen max-w-md mx-auto shadow-2xl overflow-hidden font-sans">

                                                                                              <!-- Header / Scoreboard -->
                                                                                                <header class="p-6 bg-amber-100 border-b border-amber-200 text-center flex-shrink-0">
                                                                                                    <h1 class="text-sm font-semibold tracking-wider text-amber-800 uppercase">Seeds Stashed</h1>
                                                                                                        <div id="seed-counter" class="text-4xl font-extrabold text-amber-950 mt-1">0</div>
                                                                                                            <div class="text-xs text-amber-700 font-medium mt-1">
                                                                                                                  <span id="sps-counter">0.0</span> seeds / sec
                                                                                                                      </div>
                                                                                                                        </header>

                                                                                                                          <!-- Interactive Area (Clicker) -->
                                                                                                                            <main class="flex-1 flex flex-col items-center justify-center relative p-6">
                                                                                                                                <div id="click-effect-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
                                                                                                                                    
                                                                                                                                        <button id="hamster-btn" class="relative group active:scale-95 transition-transform duration-75 select-none focus:outline-none">
                                                                                                                                              <div class="w-48 h-48 bg-amber-200 rounded-full flex items-center justify-center shadow-inner border-4 border-amber-300">
                                                                                                                                                      <span class="text-8xl filter drop-shadow">🐹</span>
                                                                                                                                                            </div>
                                                                                                                                                                </button>
                                                                                                                                                                    <p class="text-xs text-amber-600 mt-4 tracking-wide font-medium">TAP THE HAMSTER</p>
                                                                                                                                                                      </main>

                                                                                                                                                                        <!-- Upgrades List -->
                                                                                                                                                                          <section class="h-64 bg-white border-t border-amber-200 flex flex-col flex-shrink-0">
                                                                                                                                                                              <div class="px-4 py-2 bg-amber-100/50 border-b border-amber-200 flex justify-between items-center">
                                                                                                                                                                                    <span class="text-xs font-bold text-amber-900 uppercase">Supplies & Helpers</span>
                                                                                                                                                                                          <button id="wipe-btn" class="text-[10px] text-red-500 hover:underline">Reset Game</button>
                                                                                                                                                                                              </div>
                                                                                                                                                                                                  <div id="upgrade-list" class="flex-1 overflow-y-auto divide-y divide-amber-100 p-2 space-y-1">
                                                                                                                                                                                                        <!-- Upgrades populated dynamically -->
                                                                                                                                                                                                            </div>
                                                                                                                                                                                                              </section>

                                                                                                                                                                                                                <!-- Offline Progress Modal -->
                                                                                                                                                                                                                  <div id="offline-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-6 z-50">
                                                                                                                                                                                                                      <div class="bg-white rounded-2xl p-6 text-center max-w-xs w-full shadow-2xl border border-amber-200">
                                                                                                                                                                                                                            <div class="text-4xl mb-2">💤</div>
                                                                                                                                                                                                                                  <h3 class="text-lg font-bold text-slate-800">Welcome Back!</h3>
                                                                                                                                                                                                                                        <p class="text-xs text-slate-600 mt-2">While you were away, your hamsters kept running:</p>
                                                                                                                                                                                                                                              <div id="offline-seeds" class="text-2xl font-black text-amber-600 my-4">+0 Seeds</div>
                                                                                                                                                                                                                                                    <button id="claim-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-xl shadow active:scale-95 transition">
                                                                                                                                                                                                                                                            Collect
                                                                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                          <script>
                                                                                                                                                                                                                                                                              // --- GAME STATE ---
                                                                                                                                                                                                                                                                                  let state = {
                                                                                                                                                                                                                                                                                        seeds: 0,
                                                                                                                                                                                                                                                                                              clickPower: 1,
                                                                                                                                                                                                                                                                                                    lastSaved: Date.now(),
                                                                                                                                                                                                                                                                                                          upgrades: {
                                                                                                                                                                                                                                                                                                                  tube: { count: 0, baseCost: 15, sps: 0.5, name: "Cardboard Tube", icon: "📦" },
                                                                                                                                                                                                                                                                                                                          wheel: { count: 0, baseCost: 100, sps: 4, name: "Exercise Wheel", icon: "🎡" },
                                                                                                                                                                                                                                                                                                                                  friend: { count: 0, baseCost: 1100, sps: 32, name: "Hamster Buddy", icon: "🐹" },
                                                                                                                                                                                                                                                                                                                                          mix: { count: 0, baseCost: 12000, sps: 260, name: "Gourmet Seed Mix", icon: "🌻" }
                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                                                                                        const COST_MULTIPLIER = 1.15;

                                                                                                                                                                                                                                                                                                                                                            // --- UTILITIES ---
                                                                                                                                                                                                                                                                                                                                                                function formatNumber(num) {
                                                                                                                                                                                                                                                                                                                                                                      if (num >= 1e9) return (num / 1e9).toFixed(2) + "B";
                                                                                                                                                                                                                                                                                                                                                                            if (num >= 1e6) return (num / 1e6).toFixed(2) + "M";
                                                                                                                                                                                                                                                                                                                                                                                  if (num >= 1e3) return (num / 1e3).toFixed(1) + "K";
                                                                                                                                                                                                                                                                                                                                                                                        return Math.floor(num).toLocaleString();
                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                function calculateTotalSPS() {
                                                                                                                                                                                                                                                                                                                                                                                                      let total = 0;
                                                                                                                                                                                                                                                                                                                                                                                                            for (const key in state.upgrades) {
                                                                                                                                                                                                                                                                                                                                                                                                                    total += state.upgrades[key].count * state.upgrades[key].sps;
                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                return total;
                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                        function getUpgradeCost(key) {
                                                                                                                                                                                                                                                                                                                                                                                                                                              const u = state.upgrades[key];
                                                                                                                                                                                                                                                                                                                                                                                                                                                    return Math.floor(u.baseCost * Math.pow(COST_MULTIPLIER, u.count));
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                            // --- DOM REFERENCES ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                const seedCounter = document.getElementById("seed-counter");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const spsCounter = document.getElementById("sps-counter");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const hamsterBtn = document.getElementById("hamster-btn");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const upgradeList = document.getElementById("upgrade-list");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const effectContainer = document.getElementById("click-effect-container");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const offlineModal = document.getElementById("offline-modal");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const offlineSeedsText = document.getElementById("offline-seeds");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const claimBtn = document.getElementById("claim-btn");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const wipeBtn = document.getElementById("wipe-btn");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // --- ACTIONS ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function tapHamster(e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              state.seeds += state.clickPower;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // Haptic feedback for mobile
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (navigator.vibrate) navigator.vibrate(10);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // Floating text effect
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const rect = hamsterBtn.getBoundingClientRect();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const pop = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        pop.className = "tap-pop absolute text-sm font-black text-amber-700 pointer-events-none";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              pop.textContent = `+${state.clickPower} 🌻`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const x = (e.clientX || rect.left + rect.width / 2) - 20;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const y = (e.clientY || rect.top + rect.height / 2) - 40;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      pop.style.left = `${x}px`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            pop.style.top = `${y}px`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  effectContainer.appendChild(pop);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        setTimeout(() => pop.remove(), 600);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function buyUpgrade(key) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const cost = getUpgradeCost(key);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (state.seeds >= cost) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          state.seeds -= cost;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  state.upgrades[key].count++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (navigator.vibrate) navigator.vibrate(20);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // --- RENDERING ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function render() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          seedCounter.textContent = formatNumber(state.seeds);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const totalSps = calculateTotalSPS();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      spsCounter.textContent = totalSps.toFixed(1);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Render upgrade cards
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  upgradeList.innerHTML = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        for (const key in state.upgrades) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const u = state.upgrades[key];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const cost = getUpgradeCost(key);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const canAfford = state.seeds >= cost;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const row = document.createElement("button");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                row.disabled = !canAfford;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        row.onclick = () => buyUpgrade(key);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                row.className = `w-full flex items-center justify-between p-2 rounded-lg border transition ${
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          canAfford 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ? "bg-amber-50/60 border-amber-200 active:bg-amber-100" 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  : "bg-slate-50 border-slate-200 opacity-60 cursor-not-allowed"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  row.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="flex items-center gap-3 text-left">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span class="text-2xl">${u.icon}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="font-bold text-xs text-slate-800">${u.name} <span class="text-amber-700">(${u.count})</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="text-[10px] text-slate-500">+${u.sps} seeds/sec</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="font-black text-xs ${canAfford ? 'text-amber-800' : 'text-slate-400'}">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ${formatNumber(cost)} 🌻
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      upgradeList.appendChild(row);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // --- MAIN TICK LOOP (Delta Time Architecture) ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let lastTick = performance.now();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function loop(now) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const dt = (now - lastTick) / 1000;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        lastTick = now;
